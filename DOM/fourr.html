<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM || Om code || SITA RAM </title>
</head>
<body style="background-color: #212121; color:#fff;">
    <ul class="language">
        <li>JavaScript</li>
    </ul>
</body>
<script>
    function addLanguage(langName){
       const newItem =  document.createElement('li');
       newItem.innerHTML = `${langName}`
       document.querySelector('.language').
       appendChild(newItem)
    }
    addLanguage("Python")
    addLanguage("MYSQL")

    ///Optimal way to add laanguage 

    function addOpti(langName) {
        const newItem =    document.createElement('li');
        newItem.appendChild(document.createTextNode(langName))
        document.querySelector('.language').appendChild(newItem)
    }
    addOpti("Python3")

   const secondLang =  document.querySelector("li:nth-child(2)")
   console.log(secondLang)
//2    secondLang.innerHTML = "mojo"
const newLi = document.createElement('li')
newLi.textContent = "MOJO"
console.log(newLi)
secondLang.replaceWith(newLi)

//3
const thirdLang = document.querySelector('li:nth-child(3)')
const tlist = document.createElement('li')
tlist.textContent = "Ruby"
thirdLang.replaceWith(tlist)

const fourthList = document.querySelector("li:nth-child(4)")
const fList = document.createElement('li')
fList.textContent = "R language"
fourthList.replaceWith(fList)
</script>
</html>
